name: Publish V1 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.yml
      - README.md
      - pyproject.toml
      - release/v1/**
      - src/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish V1
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: v1.0.0
      RELEASE_TITLE: DBH Bilingual Subtitle Patcher V1
      PACKAGE_NAME: DBH-Bilingual-Subtitle-Mod-V1.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil
          import zipfile

          repo = Path.cwd()
          dist = repo / "dist"
          stage = dist / "DBH-Bilingual-Subtitle-Mod-V1"
          zip_path = dist / "DBH-Bilingual-Subtitle-Mod-V1.zip"
          sha_path = dist / "DBH-Bilingual-Subtitle-Mod-V1.zip.sha256.txt"
          notes_path = dist / "release-notes.md"

          if dist.exists():
              shutil.rmtree(dist)
          stage.mkdir(parents=True)

          top_level_files = [
              repo / "release" / "v1" / "install-v1-sch.ps1",
              repo / "release" / "v1" / "restore-latest.ps1",
              repo / "release" / "v1" / "README_使用说明.md",
              repo / "release" / "v1" / "RELEASE_NOTES_V1.md",
              repo / "release" / "v1" / "NO_GAME_ASSETS.txt",
              repo / "README.md",
              repo / "pyproject.toml",
          ]
          for source in top_level_files:
              shutil.copy2(source, stage / source.name)

          src_root = repo / "src"
          for source in sorted(src_root.rglob("*.py")):
              target = stage / "src" / source.relative_to(src_root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          (stage / "VERSION.txt").write_text(
              "DBH Bilingual Subtitle Patcher V1\n"
              "Build date: 2026-06-05\n"
              "Mode: local generator package; no official game assets included.\n"
              "Use install-v1-sch.ps1 and select Simplified Chinese / SCH in game.\n",
              encoding="utf-8",
          )

          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for source in sorted(stage.rglob("*")):
                  if source.is_file():
                      archive.write(source, source.relative_to(stage).as_posix())

          forbidden = (
              "__pycache__",
              ".pyc",
              ".dat",
              ".d30",
              "eng.json",
              "sch.json",
              "chi.json",
              "bilingual.json",
          )
          with zipfile.ZipFile(zip_path) as archive:
              bad = [
                  name for name in archive.namelist()
                  if any(pattern in name for pattern in forbidden)
              ]
          if bad:
              raise SystemExit("Forbidden generated or game asset entries: " + ", ".join(bad))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest().upper()
          sha_line = f"{digest}  {zip_path.name}\n"
          sha_path.write_text(sha_line, encoding="ascii")

          release_notes = (repo / "release" / "v1" / "RELEASE_NOTES_V1.md").read_text(encoding="utf-8")
          notes_path.write_text(
              release_notes
              + "\n\n## Download\n\n"
              + "- `DBH-Bilingual-Subtitle-Mod-V1.zip`\n"
              + "- `DBH-Bilingual-Subtitle-Mod-V1.zip.sha256.txt`\n\n"
              + "SHA256:\n\n```text\n"
              + sha_line
              + "```\n\n"
              + "> This release contains only tooling and documentation. It does not include official game archives, extracted subtitle JSON, generated bilingual catalogs, or official game text.\n",
              encoding="utf-8",
          )

      - name: Run test suite
        run: |
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --target main \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release-notes.md \
              --latest
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/$PACKAGE_NAME" \
            "dist/$PACKAGE_NAME.sha256.txt" \
            --clobber
