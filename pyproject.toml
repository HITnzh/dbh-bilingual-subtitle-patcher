[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dbh-bilingual-subtitle-patcher"
version = "1.0.0"
description = "Local patcher for Detroit: Become Human bilingual subtitles."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DBH Bilingual Subtitle Patcher contributors" }
]
dependencies = []

[project.scripts]
dbh-bisub = "dbh_bisub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
